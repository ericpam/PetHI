<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPD 寵物健保卡編輯器 V1.00</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* 字型載入 - 延用身分證設定 */
        @font-face { font-family: 'AdobeMing'; src: url('Font/Adobe ming Std L.otf'); }
        @font-face { font-family: 'MingLiU'; src: url('Font/新細明體.ttc'); }
        @font-face { font-family: 'KaiU'; src: url('Font/標楷體.ttc'); }
        @font-face { font-family: 'Mangal'; src: url('Font/mangal.ttf'); }

        :root { --bg-color: #f8f9fa; --primary-color: #1abc9c; } /* 健保卡清新綠色調 */
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        
        h3 { margin: 10px 0 0 0; color: #2c3e50; letter-spacing: 2px; font-weight: bold; }
        .version-tag { font-size: 12px; color: #888; margin-bottom: 20px; }

        .workspace-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 600px; gap: 15px; }
        .preview-container { line-height: 0; background-color: transparent; width: 100%; }
        canvas { display: block; border: 1px solid #ccc; border-radius: 20px; background-color: transparent; width: 100%; max-width: 600px; height: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .canvas-label { 
            font-size: 16px; 
            color: #333; 
            margin-bottom: 5px; 
            font-weight: bold; 
            width: 100%; 
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .input-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; }
        .section-title { font-size: 14px; font-weight: bold; color: #16a085; border-bottom: 2px solid var(--primary-color); padding-bottom: 5px; margin-bottom: 5px; }
        
        .input-row { display: flex; gap: 5px; align-items: flex-start; width: 100%; }
        .label-text { font-weight: bold; font-size: 13px; color: #444; width: 100px; flex-shrink: 0; text-align: left; padding-top: 8px; }
        .input-content { flex: 1; display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .flex-group { display: flex; gap: 8px; align-items: center; width: 100%; flex-wrap: wrap; }

        input, select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
        .full-width { flex: 1; width: 100%; }
        .upload-btn { cursor: pointer; padding: 7px; background-color: #fff; border: 1px solid #ddd; border-radius: 4px; transition: 0.2s; flex: 1; }
        .upload-btn:hover { background-color: #f1f1f1; }

        .easy-card-label { font-size: 12px; color: #444; display: flex; align-items: center; gap: 3px; cursor: pointer; white-space: nowrap; }
        .hint-text { font-size: 12px; color: #666; margin-top: -5px; line-height: 1.2; }
        .download-main-btn { width: 100%; padding: 14px; background-color: #1abc9c; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; letter-spacing: 4px; transition: 0.2s; }
        .download-main-btn:hover { background-color: #16a085; }

        /* 彈出視窗與互動樣式 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 420px; text-align: center; max-height: 90vh; overflow-y: auto; }
        .modal-warning { color: #dc3545; font-size: 16px; font-weight: bold; margin-bottom: 15px; line-height: 1.4; border-bottom: 2px solid #ffcccc; padding-bottom: 10px; }
        .modal-input-label { text-align: left; font-size: 13px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .modal-info-list { text-align: left; font-size: 13px; color: #007bff; margin-bottom: 10px; font-weight: bold; padding-left: 10px; border-left: 3px solid #007bff; line-height: 1.6; }
        .modal-summary-box { text-align: left; font-size: 13px; color: #444; background: #f8f9fa; padding: 12px; border-radius: 6px; border: 1px solid #eee; margin-bottom: 20px; line-height: 1.7; height: 180px; overflow-y: auto; }
        .modal-btn-group { display: flex; justify-content: center; gap: 10px; }
        .modal-btn { background-color: #1abc9c; color: white; border: none; padding: 10px 25px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .modal-btn:hover { background-color: #16a085; }
        .alert-red { color: red; font-weight: bold; }

        #barcodeTemp { display: none; }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .label-text { width: 100px !important; }
        }
    </style>
</head>
<body>

    <div style="position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; overflow: hidden;">
        <span style="font-family: 'AdobeMing';">預載</span><span style="font-family: 'MingLiU';">預載</span>
        <span style="font-family: 'KaiU';">預載</span><span style="font-family: 'Mangal';">預載</span>
    </div>

    <h3>EPD 寵物健保卡編輯器</h3>
    <div class="version-tag">Ver 1.00 健保卡專用正式版</div>

    <div class="workspace-wrapper">
        <div class="canvas-label">
            <span>● 健保卡正面</span>
            <div style="display: flex;">
                <a href="https://ctr.stylemap.co.jp/" target="_blank"><img src="https://www.f-counter.net/ani1/67/1778457911/" alt="計數器" style="vertical-align: bottom; border: none;"></a>
                <a href="https://ctr.stylemap.co.jp/" target="_blank"><img src="https://www.f-counter.net/ani2/67/1778457911/" alt="計數器" style="vertical-align: bottom; border: none;"></a>
            </div>
        </div>
        <div class="preview-container"><canvas id="frontCanvas" width="600" height="360"></canvas></div>

        <div class="input-container">
            <div class="section-title">正面資料</div>
            <div class="input-row">
                <div class="label-text">寵物品種:</div>
                <div class="input-content"><select id="species" class="full-width"></select></div>
            </div>
            <div class="input-row">
                <div class="label-text">大頭照:</div>
                <div class="input-content">
                    <div class="flex-group">
                        <input type="file" id="photoUpload" accept="image/*" style="display:none">
                        <button class="upload-btn" onclick="document.getElementById('photoUpload').click()">選擇檔案</button>
                        <label class="easy-card-label"><input type="checkbox" id="bgRemoval"> 大頭照去背</label>
                    </div>
                </div>
            </div>
            <div class="input-row">
                <div class="label-text">姓名:</div>
                <div class="input-content">
                    <input type="text" id="petName" class="full-width" value="請輸入" oninput="enforceLength(this, 20)">
                </div>
            </div>
            <div class="input-row">
                <div class="label-text">聯絡電話:</div>
                <div class="input-content">
                    <input type="text" id="phoneNum" class="full-width" placeholder="例如: 0912-345678" maxlength="11" oninput="formatPhoneNumber(this)">
                </div>
            </div>
            <div class="input-row">
                <div class="label-text">健保卡號:</div>
                <div class="input-content">
                    <input type="text" id="cardId" class="full-width" placeholder="最多15碼英數字..." maxlength="19" oninput="handleCardIdInput(this)">
                    <div class="hint-text">格式自動為每4碼隔開，預設將做為背面條碼碼文。</div>
                </div>
            </div>
        </div>

        <div class="canvas-label">● 健保卡背面</div>
        <div class="preview-container"><canvas id="backCanvas" width="600" height="360"></canvas></div>

        <div class="input-container">
            <div class="section-title">背面與送出設定</div>
            <div class="input-row">
                <div class="label-text">條碼類型:</div>
                <div class="input-content">
                    <select id="barcodeType" class="full-width" onchange="drawAll()">
                        <option value="CODE128">會員碼 CODE 128 (預設)</option>
                        <option value="CODE39">載具碼 CODE 39</option>
                    </select>
                </div>
            </div>
            <div style="border-top: 1px dashed #ddd; margin-top: 5px; padding-top: 10px;">
                <button class="download-main-btn" onclick="showShopeeModal()">確定送出</button>
            </div>
        </div>
    </div>

    <div id="shopeeModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-warning">請確定填入的資料是否正確再送出，送出後將無法修改</div>
            <div class="modal-input-label">您的蝦皮帳號:</div>
            <input type="text" id="shopeeId" class="modal-input" placeholder="請輸入您平台的帳號..." oninput="checkModalInput()" style="width:100%; margin-bottom:10px; padding:10px; border:1px solid #ccc; border-radius:4px; box-sizing: border-box;">
            
            <div id="modalInfo" class="modal-info-list"></div>
            <div id="modalSummary" class="modal-summary-box"></div>

            <div class="modal-btn-group">
                <button id="modalConfirmBtn" class="modal-btn" onclick="executeDownload()" disabled>確定</button>
                <button class="modal-btn" style="background-color: #ddd; color: #666;" onclick="document.getElementById('shopeeModal').style.display='none'">取消</button>
            </div>
        </div>
    </div>

    <canvas id="barcodeTemp"></canvas>

    <script>
        const fCanvas = document.getElementById('frontCanvas'), fCtx = fCanvas.getContext('2d');
        const bCanvas = document.getElementById('backCanvas'), bCtx = bCanvas.getContext('2d');
        const fBgImg = new Image(), bBgImg = new Image();
        let petPhoto = new Image(), originalPhotoFile = null;

        // 【健保卡版面配置參數】
        const config = {
            photo: { x: 420, y: 55, w: 145, h: 195 },
            f_name: { x: 55, y: 110, size: 32, spacing: 1.5, font: "AdobeMing", color: "#000000" },
            f_phone: { x: 55, y: 175, size: 22, spacing: 0, font: "MingLiU", color: "#333333" },
            f_cardId: { x: 55, y: 285, size: 24, spacing: 2, font: "Mangal", color: "#000000" },
            
            b_phone: { x: 120, y: 100, size: 24, spacing: 0, font: "MingLiU", color: "#000000" },
            b_barcode: { x: 60, y: 230, width: 2, height: 70 }
        };

        // 位元組長度限制
        function enforceLength(el, maxBytes) {
            let str = el.value; let len = 0; let newStr = '';
            for (let i = 0; i < str.length; i++) {
                let c = str.charCodeAt(i);
                if (c > 255) { len += 2; } else { len += 1; }
                if (len <= maxBytes) { newStr += str[i]; } else { break; }
            }
            if (str !== newStr) { el.value = newStr; }
            drawAll();
        }

        // 自動格式化電話號碼
        function formatPhoneNumber(el) {
            let val = el.value.replace(/[^0-9]/g, '');
            if (val.length > 4) {
                val = val.substring(0, 4) + '-' + val.substring(4, 10);
            }
            el.value = val;
            drawAll();
        }

        // 自動格式化健保卡號 (每四碼加一空格，限英數字轉大寫)
        function handleCardIdInput(el) {
            let clean = el.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            if (clean.length > 15) clean = clean.substring(0, 15);
            let matches = clean.match(/.{1,4}/g);
            el.value = matches ? matches.join(' ') : clean;
            drawAll();
        }

        // 切換底圖路徑：正面依物種變動，背面統一固定為 健保卡_K.jpg
        function updateBackgrounds() {
            fBgImg.src = `image_BG/${speciesSelect.value}健保卡_F.jpg`;
            bBgImg.src = `image_BG/健保卡_K.jpg`;
        }

        document.getElementById('photoUpload').addEventListener('change', e => {
            const file = e.target.files[0];
            if (file) { 
                originalPhotoFile = file; 
                const reader = new FileReader(); 
                reader.onload = ev => { petPhoto = new Image(); petPhoto.onload = drawAll; petPhoto.src = ev.target.result; }; 
                reader.readAsDataURL(file); 
            }
        });

        let isDrawing = false;
        function drawAll() { 
            if (isDrawing) return; 
            isDrawing = true; 
            requestAnimationFrame(() => { 
                if (fBgImg.complete) drawFront(); 
                if (bBgImg.complete) drawBack(); 
                isDrawing = false; 
            }); 
        }

        // 核心 Canvas 文字渲染引擎與 Fallback 機制
        function renderText(targetCtx, key, text, useFullWidth, scale = 1) {
            const cfg = config[key]; targetCtx.fillStyle = cfg.color || "black";
            let fontStack = `'${cfg.font}', sans-serif`;
            if (cfg.font === 'MingLiU') fontStack = `'MingLiU', 'PMingLiU', '新細明體', serif`;
            if (cfg.font === 'KaiU') fontStack = `'KaiU', 'BiauKai', '標楷體', serif`;
            if (cfg.font === 'AdobeMing') fontStack = `'AdobeMing', 'MingLiU', serif`;

            targetCtx.font = `${cfg.font === 'AdobeMing' || cfg.font === 'Mangal' ? 'bold ' : ''}${cfg.size * scale}px ${fontStack}`;
            let curX = cfg.x * scale, curY = cfg.y * scale;
            
            text.split('').forEach(char => { 
                targetCtx.fillText(char, curX, curY); 
                curX += targetCtx.measureText(char).width + parseFloat(cfg.spacing) * scale; 
            });
        }

        // 繪製正面
        function drawFront(scale = 1, ctx = fCtx, hidePhoto = false) {
            ctx.clearRect(0, 0, 600*scale, 360*scale); 
            ctx.drawImage(fBgImg, 0, 0, 600*scale, 360*scale);
            if (petPhoto.complete && petPhoto.naturalWidth > 0 && !hidePhoto) { 
                ctx.drawImage(petPhoto, config.photo.x*scale, config.photo.y*scale, config.photo.w*scale, config.photo.h*scale); 
            }
            ctx.textBaseline = "top"; 
            
            // 姓名渲染
            const n = document.getElementById('petName').value;
            renderText(ctx, 'f_name', n, false, scale);
            
            // 正面電話號碼
            const ph = document.getElementById('phoneNum').value || "請輸入電話";
            renderText(ctx, 'f_phone', `電話：${ph}`, false, scale);

            // 正面健保卡號
            const cid = document.getElementById('cardId').value || "0000 0000 0000 000";
            renderText(ctx, 'f_cardId', cid, false, scale);
        }

        // 繪製背面
        function drawBack(scale = 1, ctx = bCtx) {
            ctx.clearRect(0, 0, 600*scale, 360*scale); 
            ctx.drawImage(bBgImg, 0, 0, 600*scale, 360*scale); 
            ctx.textBaseline = "top"; 
            
            // 背面延用電話號碼
            const ph = document.getElementById('phoneNum').value || "";
            renderText(ctx, 'b_phone', ph, false, scale);
            
            // 條碼渲染 (預設 CODE128)
            const rawCardId = document.getElementById('cardId').value.replace(/\s+/g, '');
            const bcType = document.getElementById('barcodeType').value;
            const bc = config.b_barcode;
            if(rawCardId.trim() !== "") { 
                const temp = document.getElementById('barcodeTemp'); 
                try {
                    JsBarcode(temp, rawCardId, { format: bcType, width: bc.width*scale, height: bc.height*scale, displayValue: false, background: "rgba(0,0,0,0)", margin: 0 }); 
                    ctx.drawImage(temp, bc.x*scale, bc.y*scale); 
                } catch(e) { console.error("條碼生成失敗", e); }
            }
        }

        // 浮水印設計
        function drawWatermark(ctx, w, h) {
            ctx.save(); ctx.translate(w / 2, h / 2); ctx.rotate(-45 * Math.PI / 180);
            ctx.fillStyle = "rgba(136, 136, 136, 0.25)"; ctx.font = "bold 26px Arial";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            for (let x = -600; x <= 600; x += 180) { for (let y = -400; y <= 400; y += 80) { ctx.fillText("EPD STUDIO", x, y); } }
            ctx.restore();
        }

        // 254 DPI 封裝邏輯
        async function changeDpiBlob(blob, targetDpi) {
            const ab = await blob.arrayBuffer(), dv = new DataView(ab); let off = 0; if (dv.getUint16(off) !== 0xFFD8) return blob; off += 2;
            while (off < dv.byteLength) { const m = dv.getUint16(off), len = dv.getUint16(off + 2); if (m === 0xFFE0 && dv.getUint32(off + 4) === 0x4A464946) { dv.setUint8(off + 11, 1); dv.setUint16(off + 12, targetDpi); dv.setUint16(off + 14, targetDpi); return new Blob([ab], { type: 'image/jpeg' }); } off += 2 + len; } return blob;
        }

        function checkModalInput() { 
            const val = document.getElementById('shopeeId').value.trim(), btn = document.getElementById('modalConfirmBtn'); 
            if (!originalPhotoFile) { btn.disabled = true; btn.innerHTML = "請先上傳大頭照"; } 
            else if (val.length === 0) { btn.disabled = true; btn.innerHTML = "確定"; } 
            else { btn.disabled = false; btn.innerHTML = "確定"; } 
        }

        function showShopeeModal() {
            const petN = document.getElementById('petName').value.trim(), ph = document.getElementById('phoneNum').value.trim(), cid = document.getElementById('cardId').value.trim();
            if (petN === "" || petN === "請輸入" || ph === "" || cid === "") { alert("欄位不可為空白！請確實填寫所有健保卡資訊。"); return; }
            
            let h = ""; 
            if(document.getElementById('bgRemoval').checked) h += "<div>● 加選 大頭照去背</div>"; 
            let infoContent = h || "<div>( 無加選項目 )</div>";
            infoContent += `<div style="color: #333; margin-top: 15px; font-size: 14px;">健保卡資料確認：</div>`;
            document.getElementById('modalInfo').innerHTML = infoContent; 

            const checkEmpty = (val) => (val === "請輸入" || val === "") ? `<span class="alert-red">${val}</span>` : val;

            let summaryHTML = `
                <div>照片狀況: ${originalPhotoFile ? '已成功上傳' : '<span class="alert-red">未上傳</span>'}</div>
                <div>寵物姓名: ${checkEmpty(petN)}</div>
                <div>聯絡電話: ${checkEmpty(ph)}</div>
                <div>健保卡號: ${checkEmpty(cid)}</div>
                <div>條碼設定: ${document.getElementById('barcodeType').value}</div>
            `;
            document.getElementById('modalSummary').innerHTML = summaryHTML;
            document.getElementById('shopeeModal').style.display = 'flex'; document.getElementById('shopeeId').focus(); checkModalInput();
        }

        // 打包與上傳核心
        async function executeDownload() {
            const btn = document.getElementById('modalConfirmBtn'); btn.innerHTML = "上傳資料..."; btn.disabled = true;
            const shopeeId = document.getElementById('shopeeId').value.trim(), petN = document.getElementById('petName').value || "未命名", speciesV = document.getElementById('species').value, isBg = document.getElementById('bgRemoval').checked;
            
            // 雲端無水印高解析卡片製作 (1.5倍)
            const cloudCanvas = document.createElement('canvas'); cloudCanvas.width = 900; cloudCanvas.height = 540; const cloudCtx = cloudCanvas.getContext('2d');
            drawFront(1.5, cloudCtx, isBg); const fBlobCloud = await changeDpiBlob(await new Promise(r => cloudCanvas.toBlob(r, 'image/jpeg', 1.0)), 254);
            drawBack(1.5, cloudCtx); const bBlobCloud = await changeDpiBlob(await new Promise(r => cloudCanvas.toBlob(r, 'image/jpeg', 1.0)), 254);
            
            const txt = `【寵物健保卡】\r\n● 健保卡正面\r\n姓名: ${petN}\r\n電話: ${document.getElementById('phoneNum').value}\r\n健保卡號: ${document.getElementById('cardId').value}\r\n\r\n● 健保卡背面\r\n條碼碼文: ${document.getElementById('cardId').value.replace(/\s+/g, '')}\r\n條碼類型: ${document.getElementById('barcodeType').value}`;

            const nowD = new Date();
            const ymd = `${nowD.getFullYear()}${(nowD.getMonth() + 1).toString().padStart(2, '0')}${nowD.getDate().toString().padStart(2, '0')}`;
            const zName = `${ymd}_${shopeeId}_${petN}_健保卡.zip`;

            // Make.com 傳輸通道
            const zipCloud = new JSZip();
            zipCloud.file(`${speciesV}健保卡_${petN}_F.jpg`, fBlobCloud); 
            zipCloud.file(`健保卡_${petN}_K.jpg`, bBlobCloud); 
            zipCloud.file(`${petN}_資料.txt`, txt);
            if (isBg && originalPhotoFile) zipCloud.file(`${petN}_原圖.${originalPhotoFile.name.split('.').pop()}`, originalPhotoFile);
            
            const zipCloudBlob = await zipCloud.generateAsync({ type: "blob" });
            const WEB = "https://hook.us2.make.com/29alj8v8ayr4k59rur7l4g3fgfinuyqb"; 
            if (WEB.startsWith("http")) { 
                const fd = new FormData(); fd.append("file", zipCloudBlob, zName); fd.append("shopeeId", shopeeId); fd.append("petName", petN); 
                try { await fetch(WEB, { method: "POST", body: fd }); } catch (e) { console.error("雲端Webhook上傳失敗", e); } 
            }

            // 本地防偽水印樣本製作
            const localCanvas = document.createElement('canvas'); localCanvas.width = 450; localCanvas.height = 270; const localCtx = localCanvas.getContext('2d');
            drawFront(0.75, localCtx, isBg); drawWatermark(localCtx, 450, 270);
            const fBlobLocal = await new Promise(r => localCanvas.toBlob(r, 'image/jpeg', 0.9));
            
            drawBack(0.75, localCtx); drawWatermark(localCtx, 450, 270);
            const bBlobLocal = await new Promise(r => localCanvas.toBlob(r, 'image/jpeg', 0.9));

            const zipLocal = new JSZip();
            zipLocal.file(`${speciesV}健保卡_${petN}_F_樣本.jpg`, fBlobLocal); 
            zipLocal.file(`健保卡_${petN}_K_樣本.jpg`, bBlobLocal); 
            const zipLocalBlob = await zipLocal.generateAsync({ type: "blob" });

            alert("資料已安全上傳！正在下載您的本地複本樣本檔。");
            const link = document.createElement('a'); link.href = URL.createObjectURL(zipLocalBlob); link.download = zName; link.click();
            
            document.getElementById('shopeeModal').style.display = 'none'; btn.innerHTML = "確定"; btn.disabled = false;
        }

        // 初始化物種清單 (共 26 種)
        const speciesList = [
            { label: "01.犬民", file: "犬民" },
            { label: "02.貓民", file: "貓民" },
